name: companion

# Build de Rainy Presence para Windows. Mac y Linux todavía no compilan: el UI
# (walk) y el IPC de Discord son solo de Windows.
on:
  push:
    tags:
      - "companion-v*"
    # Prueba de CI en la rama del PR: solo tests y artefacto, sin release.
    branches:
      - feat/rainy-presence-companion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/companion-v* ]]; then
            VERSION="${GITHUB_REF_NAME#companion-v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=${VERSION}" -o rainy-presence.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: rainy-presence-windows
          path: companion/rainy-presence.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/companion-v')
        uses: softprops/action-gh-release@v2
        with:
          files: companion/rainy-presence.exe
